name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The build also generates raycast-env.d.ts, which the typecheck needs.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
